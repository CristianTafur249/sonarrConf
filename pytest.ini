[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    
# Coverage (when running pytest-cov)
[coverage:run]
source = scripts
omit = 
    */tests/*
    */__pycache__/*
    */tmp/*
    
[coverage:report]
precision = 2
show_missing = True
skip_covered = False
