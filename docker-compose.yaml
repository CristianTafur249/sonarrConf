x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Sin USER/PASS la imagen de LinuxServer desactiva la autenticación del RPC
      - USER=${TRANSMISSION_USERNAME}
      - PASS=${TRANSMISSION_PASSWORD}
    volumes:
      - ./config/transmission:/config:rw
      # Solo ve las descargas; Sonarr/Radarr las enlazan a /data/media
      - ./data/torrents:/data/torrents:rw
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    mem_reservation: 192m
    cpus: "0.75"
    healthcheck:
      # El pgrep de la imagen de LinuxServer no reconoce el nombre completo del proceso
      test: ["CMD-SHELL", "nc -z localhost 9091 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  samba:
    image: dperson/samba
    container_name: samba
    # Sin campo de "admin users": smbd crea como root todo lo que hace un admin,
    # y el bot/pipeline (uid 1000) luego no puede escribir en esas carpetas.
    command: '-u "${SAMBA_USER};${SAMBA_PASSWORD}" -s "media;/media;yes;no;yes;all" -s "downloads;/downloads;yes;no;yes;all" -s "scripts;/scripts;yes;no;yes;all"'
    stdin_open: true
    tty: true
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      # dperson/samba: uid/gid de "smbuser" (force user) -> archivos creados como 1000:1000
      - USERID=${PUID}
      - GROUPID=${PGID}
    ports:
      - "139:139"
      - "445:445"
    volumes:
      - ./data/media:/media:rw
      - ./data/torrents:/downloads:rw
      - ./scripts:/scripts:ro
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "7878:7878"
    volumes:
      - ./config/radarr-config:/config:rw
      # Un solo montaje con descargas y biblioteca: así la importación es un
      # enlace duro instantáneo en vez de una copia (esquema de TRaSH Guides)
      - ./data:/data:rw
      - ./scripts:/scripts:ro
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 640m
    mem_reservation: 320m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sonarr-config:/config:rw
      - ./scripts:/scripts:ro
      - ./data:/data:rw
    ports:
      - "8989:8989"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 640m
    mem_reservation: 320m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    networks:
      - mynetwork
    dns:
      - 172.20.0.53
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr-config:/config:rw
    ports:
      - "9696:9696"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    mem_reservation: 192m
    cpus: "0.75"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DNS cifrado (DoH) para los contenedores de indexadores: el DNS del proveedor de
  # internet no resuelve varios sitios de torrents en español aunque están en línea.
  dns-doh:
    image: adguard/dnsproxy:latest
    container_name: dns-doh
    command: ["-l", "0.0.0.0", "-p", "53", "-u", "https://1.1.1.1/dns-query", "-u", "https://1.0.0.1/dns-query", "--cache"]
    networks:
      mynetwork:
        ipv4_address: 172.20.0.53
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    cpus: "0.25"

  # Resuelve los desafíos de Cloudflare de los indexadores (lo usa Prowlarr)
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks:
      - mynetwork
    dns:
      - 172.20.0.53
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    mem_reservation: 256m
    cpus: "1.0"

  # Indexadores en español que Prowlarr no trae (DonTorrent, MejorTorrent, Wolfmax4K,
  # DivxTotal). Prowlarr los consume como Torznab genérico en http://jackett:9117
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    networks:
      - mynetwork
    dns:
      - 172.20.0.53
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AUTO_UPDATE=false
    volumes:
      - ./config/jackett-config:/config:rw
    # Sin puerto publicado: no tiene contraseña y solo lo usa Prowlarr por la red interna
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    mem_reservation: 128m
    cpus: "0.75"
    depends_on:
      - flaresolverr
      - dns-doh

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "6767:6767"
    volumes:
      - ./config/bazarr-config:/config:rw
      - ./data/media:/data/media:rw
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    mem_reservation: 192m
    cpus: "0.75"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    group_add:
      - "44"
    networks:
      - mynetwork
    volumes:
      - ./config/jellyfin-config:/config:rw
      - ./config/jellyfin-cache:/cache:rw
      # Rutas internas sin cambios para no alterar las bibliotecas existentes
      - ./data/media/Peliculas:/movies:rw
      - ./data/media/series:/tvshows:rw
      - ./data/media/anime:/anime:rw
    ports:
      - "8096:8096"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 4g
    mem_reservation: 2g
    cpus: "3.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mediajelly-cron:
    build:
      context: .
      dockerfile: Dockerfile.hybrid
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        TZ: ${TZ:-UTC}
    container_name: mediajelly-cron
    # SE RECOMIENDA ELIMINAR O COMENTAR LA SIGUIENTE LÍNEA:
    # user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - MEDIAJELLY_MODE=${MEDIAJELLY_MODE:-python}
      - PYTHONUNBUFFERED=1
      - PYTHONOPTIMIZE=2
      - OMP_NUM_THREADS=2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LANGUAGE_CACHE_TTL=86400
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    networks:
      - mynetwork
    volumes:
      - ./scripts:/mediajelly/scripts:rw
      - ./config:/mediajelly/config:ro
      - ./data/media:/mediajelly/media:rw
      - ./data/torrents:/mediajelly/downloads:rw
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 4g
    mem_reservation: 2g
    cpus: "5.0"
    depends_on:
      - transmission
      - radarr
      - sonarr

  redis:
    image: redis:7-alpine
    container_name: mediajelly-redis
    networks:
      - mynetwork
    volumes:
      - ./config/redis:/data
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}

  telegram-transmission-bot:
    image: kevinhalpin/transmission-telegram:latest
    container_name: telegram-transmission-bot
    networks:
      - mynetwork
    environment:
      - TZ=${TZ}
      - TELEGRAM_TRANSMISSION_BOT=${TELEGRAM_TRANSMISSION_BOT:-}
      - TELEGRAM_MASTER_USERNAME=${TELEGRAM_MASTER_USERNAME:-}
      - TRANSMISSION_URL=${TRANSMISSION_URL:-http://transmission:9091/transmission/rpc}
      - TRANSMISSION_USERNAME=${TRANSMISSION_USERNAME:-}
      - TRANSMISSION_PASSWORD=${TRANSMISSION_PASSWORD:-}
    command: "-token=${TELEGRAM_TRANSMISSION_BOT} -master=${TELEGRAM_MASTER_USERNAME} -url=${TRANSMISSION_URL} -username=${TRANSMISSION_USERNAME} -password=${TRANSMISSION_PASSWORD}"
    depends_on:
      - transmission
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"

networks:
  mynetwork:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
          ip_range: 172.20.240.0/20
