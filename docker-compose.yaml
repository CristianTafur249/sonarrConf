  #   restart: unless-stopped
  #   security_opt:
  #     - no-new-privileges:false
  #   network_mode: "host" # Solo funciona en Linux

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Bogota
      - PORT=5055
    networks:
      - mynetwork
    ports:
      - 5055:5055
    volumes:
      - ./config/jellyseerr-config:/app/config
    restart: unless-stopped

networks:
  mynetwork:
    external: false
