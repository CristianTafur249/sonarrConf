x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  transmission:
    image: jaymoulin/transmission:4.0.6
    container_name: transmission
    networks:
      - mynetwork
    environment:
      - TZ=${TZ}
    command: transmission-daemon -f -g /config
    volumes:
      - ./config/transmission:/config:rw
      - ./config/1tb1/Bittorrent:/downloads:rw
      - ./media/Peliculas:/movies:rw
      - ./media/series:/tvshows:rw
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    mem_reservation: 192m
    cpus: "0.75"
    healthcheck:
      test: ["CMD", "pgrep", "transmission-daemon"]
      interval: 30s
      timeout: 10s
      retries: 3

  samba:
    image: dperson/samba
    container_name: samba
    command: '-u "${SAMBA_USER};${SAMBA_PASSWORD}" -s "media;/media;yes;no;yes;all;${SAMBA_USER}" -s "downloads;/downloads;yes;no;yes;all;${SAMBA_USER}" -s "scripts;/scripts;yes;no;yes;all;${SAMBA_USER}"'
    stdin_open: true
    tty: true
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "139:139"
      - "445:445"
    volumes:
      - ./media:/media:rw
      - ./config/1tb1/Bittorrent:/downloads:rw
      - ./scripts:/scripts:ro
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "7878:7878"
    volumes:
      - ./config/radarr-config:/config:rw
      - ./media/Peliculas:/movies:rw
      - ./media/anime:/anime:rw
      - ./scripts:/scripts:ro
      - ./config/1tb1/Bittorrent:/downloads:rw
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 640m
    mem_reservation: 320m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sonarr-config:/config:rw
      - ./scripts:/scripts:ro
      - ./media/series:/tvshows:rw
      - ./media/anime:/anime:rw
      - ./config/1tb1/Bittorrent:/downloads:rw
    ports:
      - "8989:8989"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 640m
    mem_reservation: 320m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr-config:/config:rw
    ports:
      - "9696:9696"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    mem_reservation: 192m
    cpus: "0.75"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "6767:6767"
    volumes:
      - ./config/bazarr-config:/config:rw
      - ./media/Peliculas:/movies:rw
      - ./media/series:/tvshows:rw
      - ./media/anime:/anime:rw
      - ./config/1tb1/Bittorrent:/downloads:ro
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    mem_reservation: 192m
    cpus: "0.75"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    group_add:
      - "44"
    networks:
      - mynetwork
    volumes:
      - ./config/jellyfin-config:/config:rw
      - ./config/jellyfin-cache:/cache:rw
      - ./media/Peliculas:/movies:rw
      - ./media/series:/tvshows:rw
      - ./media/anime:/anime:rw
    ports:
      - "8096:8096"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 4g
    mem_reservation: 2g
    cpus: "3.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mediajelly-cron:
    build:
      context: .
      dockerfile: Dockerfile.hybrid
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: mediajelly-cron
    # SE RECOMIENDA ELIMINAR O COMENTAR LA SIGUIENTE LÍNEA:
    # user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - MEDIAJELLY_MODE=${MEDIAJELLY_MODE:-python}
      - PYTHONUNBUFFERED=1
      - PYTHONOPTIMIZE=2
      - OMP_NUM_THREADS=2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LANGUAGE_CACHE_TTL=86400
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    networks:
      - mynetwork
    volumes:
      - ./scripts:/mediajelly/scripts:rw
      - ./config:/mediajelly/config:ro
      - ./media:/mediajelly/media:rw
      - ./config/1tb1/Bittorrent:/mediajelly/downloads:rw
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 4g
    mem_reservation: 2g
    cpus: "3.0"
    depends_on:
      - transmission
      - radarr
      - sonarr

  redis:
    image: redis:7-alpine
    container_name: mediajelly-redis
    networks:
      - mynetwork
    volumes:
      - ./config/redis:/data
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}

  telegram-transmission-bot:
    image: kevinhalpin/transmission-telegram:latest
    container_name: telegram-transmission-bot
    networks:
      - mynetwork
    environment:
      - TZ=${TZ}
      - TELEGRAM_TRANSMISSION_BOT=${TELEGRAM_TRANSMISSION_BOT:-}
      - TELEGRAM_MASTER_USERNAME=${TELEGRAM_MASTER_USERNAME:-}
      - TRANSMISSION_URL=${TRANSMISSION_URL:-http://transmission:9091/transmission/rpc}
      - TRANSMISSION_USERNAME=${TRANSMISSION_USERNAME:-}
      - TRANSMISSION_PASSWORD=${TRANSMISSION_PASSWORD:-}
    command: "-token=${TELEGRAM_TRANSMISSION_BOT} -master=${TELEGRAM_MASTER_USERNAME} -url=${TRANSMISSION_URL} -username=${TRANSMISSION_USERNAME} -password=${TRANSMISSION_PASSWORD}"
    depends_on:
      - transmission
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    mem_reservation: 128m
    cpus: "0.5"

networks:
  mynetwork:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
          ip_range: 172.20.240.0/20
