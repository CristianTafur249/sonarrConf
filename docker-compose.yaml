  transmission:
    image: jaymoulin/transmission:4.0.6
    networks:
      - mynetwork
    command: transmission-daemon -f -g /config
    volumes:
      - ./config/transmission:/config
      - ./config/1tb1/Bittorrent:/downloads
      - ./media/Peliculas:/movies
      - ./media/series:/tvshows
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: "unless-stopped"


  samba:
    image: dperson/samba # no hay tag con versiones, solo latest
    command: '-u "pi;password" -s "media;/media;yes;no;yes;all;pi" -s "downloads;/downloads;yes;no;yes;all;pi"'
    stdin_open: true
    tty: true
    environment:
      - TZ=America/Bogota
      - PUID=1000
      - PGID=1000
    ports:
      - 139:139
      - 445:445
    volumes:
      - ./media:/media
      - ./config/1tb1/Bittorrent:/downloads
    restart: unless-stopped

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    networks:
      - mynetwork
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    ports:
      - 7878:7878
    volumes:
      - ./config/radarr-config:/config
      - ./media/Peliculas:/movies
      - ./scripts:/scripts
      - ./config/1tb1/Bittorrent:/downloads
    restart: "unless-stopped"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - mynetwork
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - ./config/sonarr-config:/config
      - ./scripts:/scripts
      - ./media/series:/tvshows
      - ./config/1tb1/Bittorrent:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    networks:
      - mynetwork
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    volumes:
      - ./config/prowlarr-config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - mynetwork
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
    ports:
      - 6767:6767
    volumes:
      - ./config/bazarr-config:/config
      - ./media/Peliculas:/movies
      - ./media/series:/tvshows
      - ./config/1tb1/Bittorrent:/downloads
    restart: unless-stopped


  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=America/Bogota
    group_add:
      - "44"
    networks:
      - mynetwork
    volumes:
      - ./config/jellyfin-config:/config
      - ./config/jellyfin-cache:/cache
      - ./media/Peliculas:/movies
      - ./media/series:/tvshows
    ports:
      - 8096:8096
    restart: unless-stopped

  # plex:
  #   image: jaymoulin/plex:1.41.8.9834
  #   expose:
  #     - 32400
  #     - 33400
  #   # Descomentar si NO usas network_mode: "host"
  #   # ports:
