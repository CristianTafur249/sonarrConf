x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  transmission:
    image: jaymoulin/transmission:4.0.6
    container_name: transmission
    networks:
      - mynetwork
    environment:
      - TZ=${TZ}
    command: transmission-daemon -f -g /config
    volumes:
      - ./config/transmission:/config:rw
      - ./config/1tb1/Bittorrent:/downloads:rw
      - ./media/Peliculas:/movies:rw
      - ./media/series:/tvshows:rw
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    mem_reservation: 256m
    cpus: '1.0'
    healthcheck:
      test: ["CMD", "pgrep", "transmission-daemon"]
      interval: 30s
      timeout: 10s
      retries: 3


  samba:
    image: dperson/samba
    container_name: samba
    command: '-u "pi;password" -s "media;/media;yes;no;yes;all;pi" -s "downloads;/downloads;yes;no;yes;all;pi" -s "scripts;/scripts;yes;no;yes;all;pi"'
    stdin_open: true
    tty: true
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "139:139"
      - "445:445"
    volumes:
      - ./media:/media:rw
      - ./config/1tb1/Bittorrent:/downloads:rw
      - ./scripts:/scripts:ro
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    mem_reservation: 128m
    cpus: '0.5'

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "7878:7878"
    volumes:
      - ./config/radarr-config:/config:rw
      - ./media/Peliculas:/movies:rw
      - ./media/anime:/anime:rw
      - ./scripts:/scripts:ro
      - ./config/1tb1/Bittorrent:/downloads:rw
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    mem_reservation: 512m
    cpus: '1.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sonarr-config:/config:rw
      - ./scripts:/scripts:ro
      - ./media/series:/tvshows:rw
      - ./media/anime:/anime:rw
      - ./config/1tb1/Bittorrent:/downloads:rw
    ports:
      - "8989:8989"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    mem_reservation: 512m
    cpus: '1.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr-config:/config:rw
    ports:
      - "9696:9696"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    mem_reservation: 256m
    cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - mynetwork
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "6767:6767"
    volumes:
      - ./config/bazarr-config:/config:rw
      - ./media/Peliculas:/movies:rw
      - ./media/series:/tvshows:rw
      - ./media/anime:/anime:rw
      - ./config/1tb1/Bittorrent:/downloads:ro
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    mem_reservation: 256m
    cpus: '1.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/ping"]
      interval: 30s
      timeout: 10s
      retries: 3


  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=${TZ}
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    group_add:
      - "44"
    networks:
      - mynetwork
    volumes:
      - ./config/jellyfin-config:/config:rw
      - ./config/jellyfin-cache:/cache:rw
      - ./media/Peliculas:/movies:rw
      - ./media/series:/tvshows:rw
      - ./media/anime:/anime:rw
    ports:
      - "8096:8096"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 4g
    mem_reservation: 2g
    cpus: '3.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
      - PORT=5055
    networks:
      - mynetwork
    ports:
      - "5055:5055"
    volumes:
      - ./config/jellyseerr-config:/app/config:rw
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 500m
    mem_reservation: 256m
    cpus: '1.0'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 60s
      timeout: 30s
      retries: 5

  mediajelly-cron:
    build:
      context: .
      dockerfile: Dockerfile.hybrid
    container_name: mediajelly-cron
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - MEDIAJELLY_MODE=${MEDIAJELLY_MODE:-python}
      - PYTHONUNBUFFERED=1
      - PYTHONOPTIMIZE=2
      - OMP_NUM_THREADS=4
      - MEDIAJELLY_API_PORT=8000
      - MEDIAJELLY_METRICS_PORT=9090
    networks:
      - mynetwork
    volumes:
      - ./scripts:/mediajelly/scripts:rw
      - ./config:/mediajelly/config:ro
      - ./media:/mediajelly/media:rw
      - ./config/1tb1/Bittorrent:/mediajelly/downloads:rw
    devices:
      - /dev/dri:/dev/dri  # Hardware acceleration
    ports:
      - "8000:8000"  # API REST
      - "9090:9090"  # Prometheus metrics
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 6g
    mem_reservation: 4g
    cpus: '4.0'
    depends_on:
      - transmission
      - radarr
      - sonarr

  prometheus:
    image: prom/prometheus:latest
    container_name: mediajelly-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - mynetwork
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9092:9090"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    mem_reservation: 256m
    cpus: '1.0'
    depends_on:
      - mediajelly-cron

  grafana:
    image: grafana/grafana:latest
    container_name: mediajelly-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    networks:
      - mynetwork
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    mem_reservation: 256m
    cpus: '1.0'
    depends_on:
      - prometheus

networks:
  mynetwork:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          ip_range: 172.20.240.0/20

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
